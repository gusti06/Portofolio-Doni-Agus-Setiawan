name: Deploy Portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_BASE_PATH: /Portofolio-Doni-Agus-Setiawan
      NEXT_PUBLIC_ASSET_PREFIX: /Portofolio-Doni-Agus-Setiawan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate env
        run: |
          if [ -z "$NEXT_PUBLIC_BASE_PATH" ] || [ -z "$NEXT_PUBLIC_ASSET_PREFIX" ]; then
            echo "ERROR: NEXT_PUBLIC_BASE_PATH or NEXT_PUBLIC_ASSET_PREFIX is not set"
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./out
